name: Deploy to EC2

on:
  push:
    branches:
      - main # или master — укажите вашу главную ветку

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploying to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate
            python manage.py collectstatic --noinput

            # Перезапуск сервера:
            # Если вы используете tmux:
            tmux kill-session -t backend || true
            tmux new-session -d -s backend 'cd ~/app && source venv/bin/activate && python manage.py runserver 0.0.0.0:8000 --insecure'
