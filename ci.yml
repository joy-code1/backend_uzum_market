name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/ci.sqlite3
      SECRET_KEY: ci-only-secret-key-not-used-in-production-0123456789
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Установка зависимостей
        run: pip install -r requirements/requirements.txt -r requirements/requirements-dev.txt
      - name: Линтер
        run: ruff check . && ruff format --check .
      - name: Проверка конфигурации
        run: python manage.py check
      - name: Миграции сгенерированы (нет дрейфа)
        run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI совпадает с кодом
        run: python manage.py spectacular --file /tmp/schema.yml --validate --fail-on-warn
      - name: Тесты
        run: python manage.py test --settings=config.test_settings --verbosity=2
