[pytest]
# Настройки pytest для Uzum Market Backend
DJANGO_SETTINGS_MODULE = config.test_settings

# Корень проекта (где лежат apps/, config/ и т.д.)
pythonpath = .

# Папки с тестами
testpaths = tests

# Выводить более подробную информацию об ошибках
addopts =
    -v
    --tb=short
    --no-header

# Маркеры
markers =
    slow: медленные тесты (деинтеграционные, пропускать при быстрой разработке)
    smoke: базовые smoke-тесты для проверки деплоя

